name: Import next CRTC television log month
on:
  schedule:
    - cron: '23 8 19 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Optional reporting month (YYYY-MM) for backfill or revision'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: refresh-aircheck
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Import complete archive
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then python scripts/refresh.py --month "$MONTH"; else python scripts/refresh.py; fi
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Save validated archive and start Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add snapshots/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh CRTC television logs'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main
